<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Groups - GiveHand</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f7fb;
        }

        .groups-page {
            min-height: calc(100vh - 70px);
            padding: 35px 0;
        }

        .groups-title {
            margin-bottom: 25px;
        }

        .groups-title h2 {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .groups-title p {
            color: #777;
            margin: 0;
        }

        .groups-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
            height: 680px;
        }

        /* =========================
           LEFT SIDEBAR
        ========================= */

        .groups-sidebar {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
            overflow-y: auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-header h4 {
            margin: 0;
            font-weight: 700;
        }

        .add-group-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #198754;
            color: white;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .add-group-button:hover {
            background: #157347;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .group-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: .2s;
        }

        .group-item:hover {
            background: #f2f0fa;
        }

        .group-item.active {
            background: #eee9ff;
        }

        .group-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #eee9ff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;
            flex-shrink: 0;
        }

        .group-info {
            flex: 1;
            min-width: 0;
        }

        .group-info h6 {
            margin: 0 0 4px;
            font-weight: 700;
        }

        .group-info p {
            margin: 0;
            color: #888;
            font-size: 12px;
        }

        .join-button-small {
            border: none;
            background: #198754;
            color: white;
            border-radius: 20px;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
        }

        .join-button-small:hover {
            background: #157347;
        }

        .empty-groups {
            color: #999;
            font-size: 13px;
            padding: 8px 2px;
        }

        /* =========================
           CHAT
        ========================= */

        .group-chat {
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        .chat-empty {
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            color: #888;

            padding: 30px;
        }

        .chat-header {
            padding: 18px 22px;
            border-bottom: 1px solid #eee;

            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #eee9ff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header h4 {
            margin: 0;
            font-weight: 700;
        }

        .chat-header p {
            margin: 4px 0 0;
            color: #888;
            font-size: 13px;
        }

        .join-large-button {
            border: none;
            background: #198754;
            color: white;
            border-radius: 22px;
            padding: 9px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .leave-button {
            border: 1px solid #dc3545;
            background: white;
            color: #dc3545;
            border-radius: 22px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .delete-button {
            border: 1px solid #dc3545;
            background: #dc3545;
            color: white;
            border-radius: 22px;
            padding: 8px 16px;
            cursor: pointer;
            display: none;
        }

        .delete-button:hover {
            background: #bb2d3b;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            background: #fafafe;
        }

        .message-row {
            display: flex;
            margin-bottom: 15px;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-box {
            max-width: 70%;
            background: white;
            padding: 10px 14px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .message-row.mine .message-box {
            background: #e8f5e9;
        }

        .message-user {
            font-size: 12px;
            font-weight: 700;
            color: #655b91;
            margin-bottom: 4px;
        }

        .message-text {
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #eee;
        }

        .chat-form input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 11px 18px;
            outline: none;
        }

        .send-button {
            border: none;
            border-radius: 25px;
            padding: 10px 22px;
            background: #198754;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* =========================
           CREATE GROUP MODAL
        ========================= */

        .modal-background {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.45);

            display: none;
            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .modal-background.show {
            display: flex;
        }

        .create-group-box {
            background: white;
            width: 90%;
            max-width: 480px;

            border-radius: 20px;
            padding: 25px;

            box-shadow: 0 15px 50px rgba(0,0,0,.2);
        }

        .create-group-box h3 {
            font-weight: 700;
            margin-bottom: 20px;
        }

        .create-group-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .create-group-box input,
        .create-group-box textarea {
            width: 100%;

            border: 1px solid #ddd;
            border-radius: 10px;

            padding: 10px 12px;
            margin-bottom: 15px;

            outline: none;
        }

        .create-group-box textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .cancel-button {
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            padding: 9px 18px;
            cursor: pointer;
        }

        .create-button {
            border: none;
            background: #198754;
            color: white;
            border-radius: 20px;
            padding: 9px 18px;
            cursor: pointer;
        }

        .loading {
            color: #888;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 850px) {

            .groups-layout {
                grid-template-columns: 1fr;
                height: auto;
            }

            .groups-sidebar {
                max-height: 450px;
            }

            .group-chat {
                height: 650px;
            }
        }

    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand"
            href="/feed">

            GiveHand

        </a>

        <div>

            <a
                href="/feed"
                class="btn btn-outline-light">

                Feed

            </a>

            <a
                href="/groups"
                class="btn btn-outline-light">

                Groups

            </a>

            <a
                href="/profile"
                class="btn btn-outline-light">

                Profile

            </a>

        </div>

    </div>

</nav>


<main class="groups-page">

    <div class="container">


        <div class="groups-title">

            <h2>
                Groups
            </h2>

            <p>
                Connect with volunteers and make a difference together.
            </p>

        </div>


        <div class="groups-layout">


            <!-- LEFT -->

            <div class="groups-sidebar">


                <div class="section-header">

                    <h4>
                        GROUP
                    </h4>


                    <button
                        type="button"
                        id="openCreateGroup"
                        class="add-group-button">

                        +

                    </button>

                </div>


                <div id="myGroupsList">

                    <div class="loading">
                        Loading...
                    </div>

                </div>


                <div class="section-title">
                    GROUP TO JOIN
                </div>


                <div id="groupsToJoinList">

                    <div class="loading">
                        Loading...
                    </div>

                </div>


            </div>


            <!-- CHAT -->

            <div class="group-chat">


                <div
                    id="chatEmpty"
                    class="chat-empty">

                    <div>

                        <h4>
                            Choose a group
                        </h4>

                        <p>
                            Select a group to open its conversation.
                        </p>

                    </div>

                </div>


                <div
                    id="chatContent"
                    style="
                        display:none;
                        height:100%;
                        flex-direction:column;
                    ">


                    <div class="chat-header">


                        <div
                            id="chatIcon"
                            class="chat-icon">
                        </div>


                        <div class="chat-header-info">

                            <h4 id="chatName"></h4>

                            <p id="chatInfo"></p>

                        </div>


                        <button
                            id="joinLargeButton"
                            class="join-large-button"
                            style="display:none;">

                            Join

                        </button>


                        <button
                            id="leaveButton"
                            class="leave-button"
                            style="display:none;">

                            Leave

                        </button>


                        <button
                            id="deleteButton"
                            class="delete-button">

                            Delete

                        </button>

                    </div>


                    <div
                        id="chatMessages"
                        class="chat-messages">

                    </div>


                    <form
                        id="messageForm"
                        class="chat-form">

                        <input
                            id="messageInput"
                            type="text"
                            maxlength="1000"
                            placeholder="Write a message..."
                            autocomplete="off">

                        <button
                            type="submit"
                            class="send-button">

                            Send

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- CREATE GROUP MODAL -->

<div
    id="createGroupModal"
    class="modal-background">


    <div class="create-group-box">


        <h3>
            Create a Group
        </h3>


        <form id="createGroupForm">


            <label>
                Group name
            </label>


            <input
                id="groupName"
                type="text"
                maxlength="80"
                required>


            <label>
                Description
            </label>


            <textarea
                id="groupDescription"
                maxlength="300">
            </textarea>


            <div class="modal-buttons">


                <button
                    type="button"
                    id="closeCreateGroup"
                    class="cancel-button">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="create-button">

                    Create Group

                </button>

            </div>


        </form>

    </div>

</div>


<script>

"use strict";


let currentUser = null;

let groups = [];

let currentGroup = null;


/* =========================================
   LOAD USER
========================================= */

async function loadUser() {

    const response =
        await fetch(
            "/api/profile",
            {
                credentials: "same-origin"
            }
        );


    if (!response.ok) {

        window.location.href =
            "/login";

        return false;

    }


    currentUser =
        await response.json();

    return true;
}


/* =========================================
   LOAD GROUPS
========================================= */

async function loadGroups() {

    const response =
        await fetch(
            "/api/groups",
            {
                credentials: "same-origin"
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Could not load groups"
        );

    }


    groups =
        data;


    renderGroups();
}


/* =========================================
   RENDER GROUPS
========================================= */

function renderGroups() {

    const myGroupsList =
        document.getElementById(
            "myGroupsList"
        );


    const groupsToJoinList =
        document.getElementById(
            "groupsToJoinList"
        );


    myGroupsList.innerHTML = "";

    groupsToJoinList.innerHTML = "";


    /*
       GROUP:
       Only groups the user has joined
       or created.
    */

    const myGroups =
        groups.filter(
            function(group) {

                return group.isMember === true;

            }
        );


    /*
       GROUP TO JOIN:
       Only the four permanent groups
       that the user hasn't joined yet.
    */

    const groupsToJoin =
        groups.filter(
            function(group) {

                return (
                    group.isDefault === true &&
                    group.isMember !== true
                );

            }
        );


    if (myGroups.length === 0) {

        myGroupsList.innerHTML = `

            <div class="empty-groups">

                You haven't joined or created
                any groups yet.

            </div>

        `;

    }
    else {

        myGroups.forEach(
            function(group) {

                addGroupToList(
                    myGroupsList,
                    group,
                    false
                );

            }
        );

    }


    if (groupsToJoin.length === 0) {

        groupsToJoinList.innerHTML = `

            <div class="empty-groups">

                You have joined all available groups.

            </div>

        `;

    }
    else {

        groupsToJoin.forEach(
            function(group) {

                addGroupToList(
                    groupsToJoinList,
                    group,
                    true
                );

            }
        );

    }

}


/* =========================================
   ADD GROUP TO LIST
========================================= */

function addGroupToList(
    container,
    group,
    showJoin
) {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "group-item";


    item.dataset.groupId =
        group._id;


    item.innerHTML = `

        <div class="group-icon">

            ${escapeHtml(
                group.emoji || "👥"
            )}

        </div>


        <div class="group-info">

            <h6>

                ${escapeHtml(
                    group.name
                )}

            </h6>

            <p>

                👥 ${group.memberCount || 0}
                members

            </p>

        </div>


        ${
            showJoin
                ?
                `
                <button
                    type="button"
                    class="join-button-small">

                    JOIN

                </button>
                `
                :
                ""
        }

    `;


    item.addEventListener(
        "click",
        async function(event) {


            if (
                event.target.closest(
                    ".join-button-small"
                )
            ) {

                event.stopPropagation();


                await joinGroup(
                    group
                );


                return;

            }


            await openGroup(
                group
            );

        }
    );


    container.appendChild(
        item
    );

}


/* =========================================
   OPEN GROUP
========================================= */

async function openGroup(group) {

    currentGroup =
        group;


    document
        .querySelectorAll(
            ".group-item"
        )
        .forEach(
            function(item) {

                item.classList.remove(
                    "active"
                );

            }
        );


    const selected =
        document.querySelector(
            `[data-group-id="${group._id}"]`
        );


    if (selected) {

        selected.classList.add(
            "active"
        );

    }


    document.getElementById(
        "chatEmpty"
    ).style.display =
        "none";


    document.getElementById(
        "chatContent"
    ).style.display =
        "flex";


    document.getElementById(
        "chatIcon"
    ).textContent =
        group.emoji || "👥";


    document.getElementById(
        "chatName"
    ).textContent =
        group.name;


    document.getElementById(
        "chatInfo"
    ).textContent =
        `${group.memberCount || 0} members • ${group.description || ""}`;


    const joinButton =
        document.getElementById(
            "joinLargeButton"
        );


    const leaveButton =
        document.getElementById(
            "leaveButton"
        );


    const deleteButton =
        document.getElementById(
            "deleteButton"
        );


    /*
       Group To Join
    */

    if (!group.isMember) {

        joinButton.style.display =
            "block";

        leaveButton.style.display =
            "none";

        deleteButton.style.display =
            "none";


        document.getElementById(
            "chatMessages"
        ).innerHTML = `

            <div class="chat-empty">

                <div>

                    <h4>
                        Join this group
                    </h4>

                    <p>
                        Join the group to see
                        and send messages.
                    </p>

                </div>

            </div>

        `;


        return;

    }


    joinButton.style.display =
        "none";


    /*
       Only the creator can delete.
    */

    if (
        group.isDefault !== true &&
        group.createdBy &&
        String(
            group.createdBy
        ) ===
        String(
            currentUser._id
        )
    ) {

        deleteButton.style.display =
            "block";

    }
    else {

        deleteButton.style.display =
            "none";

    }


    leaveButton.style.display =
        group.isDefault === true
            ? "block"
            : "block";


    await loadMessages();

}


/* =========================================
   JOIN GROUP
========================================= */

async function joinGroup(group) {

    const response =
        await fetch(
            `/api/groups/${group._id}/join`,
            {
                method: "POST",
                credentials: "same-origin"
            }
        );


    const result =
        await response.json();


    if (!response.ok) {

        alert(
            result.error ||
            "Could not join group"
        );

        return;

    }


    await loadGroups();


    const joinedGroup =
        groups.find(
            function(item) {

                return (
                    String(item._id) ===
                    String(group._id)
                );

            }
        );


    if (joinedGroup) {

        await openGroup(
            joinedGroup
        );

    }

}


/* =========================================
   LEAVE GROUP
========================================= */

document
    .getElementById(
        "leaveButton"
    )
    .addEventListener(
        "click",
        async function() {


            if (!currentGroup) {
                return;
            }


            const confirmed =
                confirm(
                    "Are you sure you want to leave this group?"
                );


            if (!confirmed) {
                return;
            }


            const response =
                await fetch(
                    `/api/groups/${currentGroup._id}/leave`,
                    {
                        method: "POST",
                        credentials: "same-origin"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                alert(
                    result.error ||
                    "Could not leave group"
                );

                return;

            }


            currentGroup =
                null;


            document.getElementById(
                "chatContent"
            ).style.display =
                "none";


            document.getElementById(
                "chatEmpty"
            ).style.display =
                "flex";


            await loadGroups();

        }
    );


/* =========================================
   DELETE GROUP
========================================= */

document
    .getElementById(
        "deleteButton"
    )
    .addEventListener(
        "click",
        async function() {


            if (!currentGroup) {
                return;
            }


            if (
                currentGroup.isDefault === true
            ) {

                alert(
                    "The permanent groups cannot be deleted."
                );

                return;

            }


            if (
                !currentGroup.createdBy ||
                String(
                    currentGroup.createdBy
                ) !==
                String(
                    currentUser._id
                )
            ) {

                alert(
                    "Only the creator can delete this group."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Are you sure you want to delete this group? All messages will also be deleted."
                );


            if (!confirmed) {
                return;
            }


            const response =
                await fetch(
                    `/api/groups/${currentGroup._id}`,
                    {
                        method: "DELETE",
                        credentials: "same-origin"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                alert(
                    result.error ||
                    "Could not delete group"
                );

                return;

            }


            currentGroup =
                null;


            document.getElementById(
                "chatContent"
            ).style.display =
                "none";


            document.getElementById(
                "chatEmpty"
            ).style.display =
                "flex";


            await loadGroups();

        }
    );


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages() {

    if (!currentGroup) {
        return;
    }


    const response =
        await fetch(
            `/api/groups/${currentGroup._id}/messages`,
            {
                credentials: "same-origin"
            }
        );


    const messages =
        await response.json();


    if (!response.ok) {

        document.getElementById(
            "chatMessages"
        ).innerHTML = `

            <div class="chat-empty">

                <p>
                    ${escapeHtml(
                        messages.error ||
                        "Could not load messages"
                    )}
                </p>

            </div>

        `;

        return;

    }


    renderMessages(
        messages
    );

}


/* =========================================
   RENDER MESSAGES
========================================= */

function renderMessages(messages) {

    const box =
        document.getElementById(
            "chatMessages"
        );


    box.innerHTML = "";


    if (messages.length === 0) {

        box.innerHTML = `

            <div class="chat-empty">

                <div>

                    <h4>
                        No messages yet
                    </h4>

                    <p>
                        Be the first to send a message!
                    </p>

                </div>

            </div>

        `;

        return;

    }


    messages.forEach(
        function(message) {


            const row =
                document.createElement(
                    "div"
                );


            const isMine =
                currentUser &&
                message.userId &&
                String(
                    message.userId
                ) ===
                String(
                    currentUser._id
                );


            row.className =
                isMine
                    ? "message-row mine"
                    : "message-row";


            const time =
                new Date(
                    message.createdAt
                ).toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            row.innerHTML = `

                <div class="message-box">

                    <div class="message-user">

                        ${
                            isMine
                                ? "You"
                                : "@" +
                                  escapeHtml(
                                      message.username ||
                                      "User"
                                  )
                        }

                    </div>


                    <div class="message-text">

                        ${escapeHtml(
                            message.text
                        )}

                    </div>


                    <div class="message-time">

                        ${time}

                    </div>

                </div>

            `;


            box.appendChild(
                row
            );

        }
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =========================================
   SEND MESSAGE
========================================= */

document
    .getElementById(
        "messageForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!currentGroup) {
                return;
            }


            if (!currentGroup.isMember) {

                alert(
                    "Please join the group first."
                );

                return;

            }


            const input =
                document.getElementById(
                    "messageInput"
                );


            const text =
                input.value.trim();


            if (!text) {
                return;
            }


            const response =
                await fetch(
                    `/api/groups/${currentGroup._id}/messages`,
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                text: text
                            })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                alert(
                    result.error ||
                    "Could not send message"
                );

                return;

            }


            input.value = "";

            await loadMessages();

            input.focus();

        }
    );

document

/* =========================================
   CREATE GROUP
========================================= */

document
    .getElementById(
        "createGroupForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById(
                        "groupName"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "groupDescription"
                    )
                    .value
                    .trim();


            if (!name) {
                return;
            }


            const response =
                await fetch(
                    "/api/groups",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name:
                                    name,

                                description:
                                    description
                            })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                alert(
                    result.error ||
                    "Could not create group"
                );

                return;

            }


            document
                .getElementById(
                    "createGroupForm"
                )
                .reset();


            createModal.classList.remove(
                "show"
            );


            await loadGroups();


            const createdGroup =
                groups.find(
                    function(group) {

                        return (
                            String(
                                group._id
                            ) ===
                            String(
                                result.group._id
                            )
                        );

                    }
                );


            if (createdGroup) {

                await openGroup(
                    createdGroup
                );

            }

        }
    );


/* =========================================
   CLOSE MODAL OUTSIDE
========================================= */

createModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            createModal
        ) {

            createModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value || "";

    return div.innerHTML;

}


/* =========================================
   START
========================================= */

async function startPage() {

    try {

        const loggedIn =
            await loadUser();


        if (!loggedIn) {
            return;
        }


        await loadGroups();

    }
    catch (error) {

        console.error(
            "GROUP PAGE ERROR:",
            error
        );

        document.getElementById(
            "myGroupsList"
        ).innerHTML = `

            <div class="empty-groups">
                Could not load groups.
            </div>

        `;

    }

}


startPage();
