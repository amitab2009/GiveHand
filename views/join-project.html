<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project Details - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="/css/style.css">


   
</head>


<body>


<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/feed">
            GiveHand
        </a>


        <div>

            <a href="/feed"
               class="btn btn-outline-light">

                Feed

            </a>


            <a href="#"
               class="btn btn-outline-light">

                Groups

            </a>


            <a href="#"
               class="btn btn-outline-light">

                Profile

            </a>

        </div>

    </div>

</nav>



<main class="project-details-page">

    <div class="container">


        <a href="/feed"
           class="back-to-feed">

            ← Back to Feed

        </a>


        <div id="loadingMessage"
             class="project-loading">

            Loading project...

        </div>


        <div id="projectDetails"
             class="project-details-card d-none">


            <div class="details-image-side">


                <img id="projectImage"
                     class="details-image"
                     alt="Project image">


                <div id="projectImagePlaceholder"
                     class="details-image-placeholder">


                    <span id="projectCategoryImage">

                        Community

                    </span>


                </div>


            </div>



            <div class="details-content">


                <span id="projectCategory"
                      class="details-category">
                </span>


                <h1 id="projectName"></h1>


                <p id="projectLocation"
                   class="details-location">
                </p>


                <button type="button"
                        id="openMapButton"
                        class="project-map-link">

                    Map to the place

                </button>


                <p id="projectOwner"
                   class="details-owner">
                </p>


                <h5>
                    About this project
                </h5>


                <p id="projectDescription"
                   class="details-description">
                </p>



                <div class="details-boxes">


                    <div class="details-small-box">


                        <span class="details-icon">
                            👥
                        </span>


                        <div>


                            <p class="details-label">
                                Volunteers joined
                            </p>


                            <h3>

                                <span id="joinedCount">
                                    0
                                </span>

                                /

                                <span id="volunteersNeeded">
                                    0
                                </span>

                            </h3>


                        </div>


                    </div>



                    <div class="details-small-box">


                        <span class="details-icon">
                            ☎️
                        </span>


                        <div>


                            <p class="details-label">
                                Organizer contact
                            </p>


                            <h6 id="projectContact"></h6>


                        </div>


                    </div>


                </div>



                <div class="volunteer-progress">


                    <div id="progressBar"
                         class="volunteer-progress-bar">
                    </div>


                </div>


                <p id="placesLeft"
                   class="places-left">
                </p>



                <button id="joinButton"
                        class="btn btn-success details-join-button">

                    Join This Project

                </button>



                <button id="cancelButton"
                        class="btn btn-danger details-join-button"
                        style="display: none;">

                    Cancel Joining

                </button>


                <p id="joinMessage"
                   class="join-message">
                </p>



                <div class="owner-project-actions">


                    <button id="editButton"
                            class="owner-action-button edit-project-button"
                            style="display: none;">

                        Edit

                    </button>



                    <button id="deleteButton"
                            class="owner-action-button delete-project-button"
                            style="display: none;">

                        Delete

                    </button>


                </div>


            </div>


        </div>





    </div>

</main>



<!-- PROJECT MAP MODAL -->

<div id="mapOverlay"
     class="map-overlay">

    <div class="map-modal">

        <button type="button"
                id="closeMapButton"
                class="map-close-button"
                aria-label="Close map">

            ×

        </button>


        <div class="map-modal-header">

            <h3>
                Project Location
            </h3>

            <p id="projectMapAddress">
            </p>

        </div>


        <div id="projectMap"
             class="project-map">
        </div>


        <p id="projectMapMessage"
           class="project-map-message">
        </p>

    </div>

</div>


<!-- DELETE CONFIRMATION MODAL -->



<div id="deleteConfirmOverlay"
     class="delete-confirm-overlay">


    <div class="delete-confirm-modal">


        <div class="delete-confirm-icon">

            🗑️

        </div>


        <h3>

            DO YOU SURE YOU WANNA
            DELETE THIS PROJECT?

        </h3>


        <p>

            This action cannot be undone.

        </p>


        <div class="delete-confirm-actions">


            <button type="button"
                    id="deleteCancelButton"
                    class="delete-confirm-cancel">

                CANCEL

            </button>


            <button type="button"
                    id="deleteConfirmButton"
                    class="delete-confirm-delete">

                DELETE

            </button>


        </div>


    </div>


</div>



<!-- TOAST MESSAGE -->

<div id="toastMessage"
     class="toast-message">
</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


const projectId =
    window.location.pathname.split("/").pop();


const loadingMessage =
    document.getElementById("loadingMessage");


const projectDetails =
    document.getElementById("projectDetails");


const joinButton =
    document.getElementById("joinButton");


const cancelButton =
    document.getElementById("cancelButton");


const joinMessage =
    document.getElementById("joinMessage");


const editButton =
    document.getElementById("editButton");


const deleteButton =
    document.getElementById("deleteButton");


const toastMessage =
    document.getElementById("toastMessage");


const openMapButton =
    document.getElementById("openMapButton");


const mapOverlay =
    document.getElementById("mapOverlay");


const closeMapButton =
    document.getElementById("closeMapButton");


const projectMapAddress =
    document.getElementById("projectMapAddress");


const projectMapMessage =
    document.getElementById("projectMapMessage");


let currentProject = null;


let toastTimeout;


let projectMap = null;


let projectMarker = null;


let lastMapLocation = "";



function showToast(message, type) {


    clearTimeout(toastTimeout);


    toastMessage.textContent =
        message;


    toastMessage.className =
        "toast-message";


    if (type === "error") {


        toastMessage.classList.add(
            "toast-error"
        );


    }

    else {


        toastMessage.classList.add(
            "toast-success"
        );


    }


    setTimeout(
        function() {


            toastMessage.classList.add(
                "show"
            );


        },
        10
    );


    toastTimeout =
        setTimeout(
            function() {


                toastMessage.classList.remove(
                    "show"
                );


            },
            3000
        );

}



function getSavedCoordinates(location) {

    try {

        const saved =
            localStorage.getItem(
                "givehand-map-" +
                location.toLowerCase()
            );


        if (!saved) {

            return null;

        }


        return JSON.parse(saved);

    }

    catch (error) {

        return null;

    }

}



function saveCoordinates(location, latitude, longitude) {

    try {

        localStorage.setItem(
            "givehand-map-" +
            location.toLowerCase(),
            JSON.stringify({
                latitude: latitude,
                longitude: longitude
            })
        );

    }

    catch (error) {

    }

}



function showMap(latitude, longitude, location) {

    projectMapAddress.textContent =
        "📍 " + location;


    projectMapMessage.textContent =
        "";


    if (!projectMap) {

        projectMap =
            L.map("projectMap").setView(
                [
                    latitude,
                    longitude
                ],
                14
            );


        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(projectMap);


        projectMarker =
            L.marker([
                latitude,
                longitude
            ]).addTo(projectMap);

    }

    else {

        projectMap.setView(
            [
                latitude,
                longitude
            ],
            14
        );


        projectMarker.setLatLng(
            [
                latitude,
                longitude
            ]
        );

    }


    projectMarker
        .bindPopup(location)
        .openPopup();


    setTimeout(
        function() {

            projectMap.invalidateSize();

        },
        100
    );

}



async function updateProjectMap(location) {

    if (!location) {

        return;

    }


    if (
        lastMapLocation.toLowerCase() ===
        location.toLowerCase()
    ) {

        return;

    }


    lastMapLocation =
        location;


    const savedCoordinates =
        getSavedCoordinates(location);


    if (savedCoordinates) {

        showMap(
            savedCoordinates.latitude,
            savedCoordinates.longitude,
            location
        );

        return;

    }


    projectMapAddress.textContent =
        "📍 " + location;


    projectMapMessage.textContent =
        "Finding this location on the map...";


    try {

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search" +
                "?format=json" +
                "&limit=1" +
                "&q=" +
                encodeURIComponent(location)
            );


        const results =
            await response.json();


        if (
            !response.ok ||
            !Array.isArray(results) ||
            results.length === 0
        ) {

            projectMapMessage.textContent =
                "This location could not be found on the map.";

            return;

        }


        const latitude =
            Number(results[0].lat);


        const longitude =
            Number(results[0].lon);


        saveCoordinates(
            location,
            latitude,
            longitude
        );


        showMap(
            latitude,
            longitude,
            location
        );

    }

    catch (error) {

        projectMapMessage.textContent =
            "The map could not be loaded right now.";

    }

}



function getJoinedProjects() {

    try {

        const savedProjects =
            localStorage.getItem("joinedProjects");


        if (!savedProjects) {

            return [];

        }


        const projects =
            JSON.parse(savedProjects);


        if (!Array.isArray(projects)) {

            return [];

        }


        return projects;

    }

    catch (error) {

        return [];

    }

}



function showProject(project) {


    currentProject = project;


    editButton.style.display =
        project.isOwner ? "block" : "none";


    deleteButton.style.display =
        project.isOwner ? "block" : "none";


    const joined =
        project.joined || 0;


    const needed =
        project.volunteers || 0;


    const placesLeft =
        Math.max(
            needed - joined,
            0
        );


    document.getElementById("projectName").textContent =
        project.projectName;


    document.getElementById("projectLocation").textContent =
        "📍 " + project.location;


    updateProjectMap(
        project.location
    );


    document.getElementById("projectOwner").textContent =
        "Organized by @" +
        (project.createdByUsername ||
         "Unknown user");


    document.getElementById("projectCategory").textContent =
        project.category;


    document.getElementById("projectCategoryImage").textContent =
        project.category;


    document.getElementById("projectDescription").textContent =
        project.description;


    document.getElementById("projectContact").textContent =
        project.contact;


    document.getElementById("joinedCount").textContent =
        joined;


    document.getElementById("volunteersNeeded").textContent =
        needed;


    document.getElementById("placesLeft").textContent =
        placesLeft +
        " volunteer places left";



    const progress =

        needed > 0

            ? Math.min(
                (joined / needed) * 100,
                100
              )

            : 0;



    document.getElementById("progressBar").style.width =
        progress + "%";



    const image =
        document.getElementById("projectImage");


    const placeholder =
        document.getElementById(
            "projectImagePlaceholder"
        );



    if (project.image) {


        image.src =
            project.image;


        image.style.display =
            "block";


        placeholder.style.display =
            "none";


    }

    else {


        image.style.display =
            "none";


        placeholder.style.display =
            "flex";

    }



    if (project.isOwner) {


        joinButton.style.display =
            "none";


        cancelButton.style.display =
            "none";


        joinMessage.textContent =
            "This is your project.";


    }


    else if (project.currentUserJoined) {


        joinButton.style.display =
            "none";


        cancelButton.style.display =
            "block";


        cancelButton.disabled =
            false;


        cancelButton.textContent =
            "Cancel Joining";


        joinMessage.textContent =
            "";


    }


    else if (placesLeft === 0) {


        joinButton.style.display =
            "block";


        joinButton.disabled =
            true;


        joinButton.textContent =
            "Project Full";


        cancelButton.style.display =
            "none";


        joinMessage.textContent =
            "";


    }


    else {


        joinButton.style.display =
            "block";


        joinButton.disabled =
            false;


        joinButton.textContent =
            "Join This Project";


        cancelButton.style.display =
            "none";


        joinMessage.textContent =
            "";

    }



    loadingMessage.classList.add(
        "d-none"
    );


    projectDetails.classList.remove(
        "d-none"
    );

}



async function loadProject() {


    try {


        const response =
            await fetch(
                "/api/projects/" +
                projectId
            );


        const project =
            await response.json();


        if (!response.ok) {

            throw new Error(
                project.error
            );

        }


        showProject(project);


    }


    catch (error) {


        loadingMessage.textContent =
            "The project could not be loaded.";


        if (!currentProject) {

            showToast(
                "The project could not be loaded.",
                "error"
            );

        }

    }

}



joinButton.addEventListener(
    "click",
    async function() {


        joinButton.disabled =
            true;


        joinButton.textContent =
            "Joining...";


        try {


            const response =
                await fetch(
                    "/api/projects/" +
                    projectId +
                    "/join",
                    {
                        method: "POST"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Could not join project"
                );

            }


            await loadProject();


            showToast(
                "You joined the project successfully!",
                "success"
            );


        }


        catch (error) {


            showToast(
                error.message,
                "error"
            );


            if (currentProject) {

                showProject(
                    currentProject
                );

            }

        }

    }
);



cancelButton.addEventListener(
    "click",
    async function() {


        cancelButton.disabled =
            true;


        cancelButton.textContent =
            "Cancelling...";


        try {


            const response =
                await fetch(
                    "/api/projects/" +
                    projectId +
                    "/leave",
                    {
                        method: "POST"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Could not cancel joining"
                );

            }


            await loadProject();


            showToast(
                "Your registration was cancelled.",
                "success"
            );


        }


        catch (error) {


            cancelButton.disabled =
                false;


            cancelButton.textContent =
                "Cancel Joining";


            showToast(
                error.message,
                "error"
            );

        }

    }
);


openMapButton.addEventListener(
    "click",
    async function() {

        if (!currentProject) {

            return;

        }


        mapOverlay.classList.add(
            "show"
        );


        await updateProjectMap(
            currentProject.location
        );


        setTimeout(
            function() {

                if (projectMap) {

                    projectMap.invalidateSize();

                }

            },
            100
        );

    }
);


closeMapButton.addEventListener(
    "click",
    function() {

        mapOverlay.classList.remove(
            "show"
        );

    }
);


mapOverlay.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            mapOverlay
        ) {

            mapOverlay.classList.remove(
                "show"
            );

        }

    }
);


editButton.addEventListener(
    "click",
    function() {


        window.location.href =
            "/edit-project/" +
            projectId;

    }
);


//    CUSTOM DELETE MODAL



const deleteConfirmOverlay =
    document.getElementById(
        "deleteConfirmOverlay"
    );


const deleteCancelButton =
    document.getElementById(
        "deleteCancelButton"
    );


const deleteConfirmButton =
    document.getElementById(
        "deleteConfirmButton"
    );



/*
   When the user clicks Delete,
   open our custom modal instead
   of the browser confirm().
*/


deleteButton.addEventListener(
    "click",
    function() {


        deleteConfirmOverlay.classList.add(
            "show"
        );

    }
);



/*
   Cancel button
*/


deleteCancelButton.addEventListener(
    "click",
    function() {


        deleteConfirmOverlay.classList.remove(
            "show"
        );

    }
);



/*
   Clicking outside the modal
   also closes it.
*/


deleteConfirmOverlay.addEventListener(
    "click",
    function(event) {


        if (
            event.target ===
            deleteConfirmOverlay
        ) {


            deleteConfirmOverlay.classList.remove(
                "show"
            );

        }

    }
);



/*
   Actual project deletion
*/


deleteConfirmButton.addEventListener(
    "click",
    async function() {


        deleteConfirmButton.disabled =
            true;


        deleteConfirmButton.textContent =
            "DELETING...";


        try {


            const response =
                await fetch(
                    "/api/projects/" +
                    projectId,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {


                throw new Error(
                    result.error ||
                    "Could not delete project"
                );


            }


            deleteConfirmOverlay.classList.remove(
                "show"
            );


            showToast(
                "Project deleted successfully.",
                "success"
            );


            setTimeout(
                function() {


                    window.location.href =
                        "/profile";


                },
                900
            );


        }


        catch (error) {


            deleteConfirmButton.disabled =
                false;


            deleteConfirmButton.textContent =
                "DELETE";


            deleteConfirmOverlay.classList.remove(
                "show"
            );


            showToast(
                error.message ||
                "Could not delete project",
                "error"
            );

        }

    }
);



loadProject();



/*
Loads the current project information every 3 seconds.
*/


setInterval(
    loadProject,
    3000
);


</script>


</body>

</html>
