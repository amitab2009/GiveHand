<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Statistics - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/feed">GiveHand</a>

        <div>
            <a href="/feed" class="btn btn-outline-light">Feed</a>
            <a href="/groups" class="btn btn-outline-light">Groups</a>
            <a href="/statistics" class="btn btn-outline-light">Statistics</a>
            <a href="/profile" class="btn btn-outline-light">Profile</a>
        </div>

    </div>

</nav>


<main class="statistics-page">

    <div class="container">

        <div class="statistics-title">

            <h2>Community Statistics</h2>

            <p>
                Live information based on the projects in GiveHand.
            </p>

        </div>


        <div class="statistics-grid">

            <article class="statistics-card">

                <h3>Projects by Category</h3>

                <p class="statistics-description">
                    Number of projects in each category.
                </p>

                <div id="projectsChart"
                     class="statistics-chart">
                </div>

            </article>


            <article class="statistics-card">

                <h3>Volunteers by Category</h3>

                <p class="statistics-description">
                    Number of joined volunteers in each category.
                </p>

                <div id="volunteersChart"
                     class="statistics-chart">
                </div>

            </article>

        </div>


        <p id="statisticsMessage"
           class="statistics-message">
        </p>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<script>

async function loadStatistics() {

    try {

        const projectsResponse =
            await fetch(
                "/api/statistics/projects-by-category"
            );

        const volunteersResponse =
            await fetch(
                "/api/statistics/volunteers-by-category"
            );


        if (
            !projectsResponse.ok ||
            !volunteersResponse.ok
        ) {

            throw new Error(
                "Could not load statistics"
            );

        }


        const projectsData =
            await projectsResponse.json();

        const volunteersData =
            await volunteersResponse.json();


        drawChart(
            "#projectsChart",
            projectsData
        );

        drawChart(
            "#volunteersChart",
            volunteersData
        );

    }

    catch (error) {

        console.log(
            "STATISTICS ERROR:",
            error
        );

        document.getElementById(
            "statisticsMessage"
        ).textContent =
            "Could not load statistics.";

    }

}



function drawChart(chartId, data) {

    const container =
        document.querySelector(chartId);

    container.innerHTML = "";


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p class='statistics-empty'>No data available yet.</p>";

        return;

    }


    const width = 500;
    const height = 300;

    const margin = {
        top: 20,
        right: 20,
        bottom: 60,
        left: 50
    };


    const svg =
        d3.select(chartId)
            .append("svg")
            .attr(
                "viewBox",
                `0 0 ${width} ${height}`
            )
            .attr(
                "preserveAspectRatio",
                "xMidYMid meet"
            );


    const x =
        d3.scaleBand()
            .domain(
                data.map(
                    function(item) {
                        return item._id || "Other";
                    }
                )
            )
            .range([
                margin.left,
                width - margin.right
            ])
            .padding(0.3);


    const highestValue =
        d3.max(
            data,
            function(item) {
                return item.total;
            }
        ) || 1;


    const y =
        d3.scaleLinear()
            .domain([
                0,
                highestValue
            ])
            .nice()
            .range([
                height - margin.bottom,
                margin.top
            ]);


    svg.append("g")
        .attr(
            "transform",
            `translate(0,${height - margin.bottom})`
        )
        .call(
            d3.axisBottom(x)
        )
        .selectAll("text")
        .attr(
            "transform",
            "rotate(-25)"
        )
        .style(
            "text-anchor",
            "end"
        );


    svg.append("g")
        .attr(
            "transform",
            `translate(${margin.left},0)`
        )
        .call(
            d3.axisLeft(y)
                .ticks(5)
                .tickFormat(d3.format("d"))
        );


    svg.selectAll(".statistics-bar")
        .data(data)
        .enter()
        .append("rect")
        .attr(
            "class",
            "statistics-bar"
        )
        .attr(
            "x",
            function(item) {
                return x(
                    item._id || "Other"
                );
            }
        )
        .attr(
            "y",
            function(item) {
                return y(item.total);
            }
        )
        .attr(
            "width",
            x.bandwidth()
        )
        .attr(
            "height",
            function(item) {
                return (
                    height -
                    margin.bottom -
                    y(item.total)
                );
            }
        )
        .attr(
            "rx",
            5
        );


    svg.selectAll(".statistics-value")
        .data(data)
        .enter()
        .append("text")
        .attr(
            "class",
            "statistics-value"
        )
        .attr(
            "x",
            function(item) {
                return (
                    x(
                        item._id || "Other"
                    ) +
                    x.bandwidth() / 2
                );
            }
        )
        .attr(
            "y",
            function(item) {
                return y(item.total) - 7;
            }
        )
        .attr(
            "text-anchor",
            "middle"
        )
        .text(
            function(item) {
                return item.total;
            }
        );

}



loadStatistics();

</script>

</body>

</html>
