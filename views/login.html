<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="/">GiveHand</a>

        <div>
            <a href="/" class="btn btn-outline-light">Home</a>
            <a href="/register" class="btn btn-light">Register</a>
        </div>

    </div>
</nav>
<div class="register-page">
    <div class="register-box">

        <h2>Welcome back</h2>
        <p>
            Login to your GiveHand account.
        </p>


 <form id="loginForm">

          <label>Username</label>
          <input type="text" id="username" class="form-control">
         <p id="usernameError" class="error-text"></p>

          <label>Password</label>
          <input type="password" id="password" class="form-control">
          <p id="passwordError" class="error-text"></p>

          <button type="submit" class="btn btn-success">
          Login
          </button>

          <p id="loginError" class="error-text"></p>

    </form>

        <p class="login-text">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>
<script>

const form = document.getElementById("loginForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    document.getElementById("usernameError").textContent = "";
    document.getElementById("passwordError").textContent = "";
    document.getElementById("loginError").textContent = "";

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "") {
        document.getElementById("usernameError").textContent =
            "Username is required";
        return;
    }

    if (password === "") {
        document.getElementById("passwordError").textContent =
            "Password is required";
        return;
    }

    const response = await fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: username,
            password: password
        })

    });
const data = await response.json();

if (data.error === "user") {
    document.getElementById("usernameError").textContent =
        "Username does not exist";
    return;
}

if (data.error === "password") {
    document.getElementById("passwordError").textContent =
        "Password is incorrect";
    return;
}

if (data.success) {
    window.location.href = "/feed";
    return;
}

document.getElementById("loginError").textContent =
    "Login failed";

});

</script>
</body>

</html>
