<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="/">GiveHand</a>

        <div>
            <a href="/" class="btn btn-outline-light">Home</a>
            <a href="/login" class="btn btn-light">Login</a>
        </div>

    </div>
</nav>

<div class="register-page">
    <div class="register-box">

        <h2>Create your account</h2>

        <p>
            Join GiveHand and start helping your community.
        </p>
        <form id="registerForm" novalidate>

        <label>Full name</label>
        <input type="text" name="fullName" id="fullName" class="form-control">

        <p id="nameError" class="error-text"></p>


        <label>Email</label>
        <input type="text" name="email" id="email" class="form-control">

        <p id="emailError" class="error-text"></p>

        <label>Username</label>
        <input type="text" name="username" id="username" class="form-control">

        <p id="usernameError" class="error-text"></p>
        <label>Password</label>
        <input type="password" name="password" id="password" class="form-control">

        <p id="passwordError" class="error-text"></p>


        <button type="submit" class="btn btn-success">
            Register
        </button>
        <p id="successMessage" class="success-text"></p>

        </form>
        <p class="login-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>


<script>
const form = document.getElementById("registerForm");
const fullNameInput = document.getElementById("fullName");
const emailInput = document.getElementById("email");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");



fullNameInput.addEventListener("blur", function() {

    if (fullNameInput.value.length < 2) {
        document.getElementById("nameError").textContent =
            "Full name is too short";
    }
    else {
        document.getElementById("nameError").textContent = "";
    }

});

emailInput.addEventListener("blur", function() {

    const email = emailInput.value;

    if (!email.includes("@") || !email.includes(".")) {
        document.getElementById("emailError").textContent =
            "Please enter a valid email";
    }
    else {
        document.getElementById("emailError").textContent = "";
    }

});

passwordInput.addEventListener("blur", function() {

    const password = passwordInput.value;
    if (password.length < 6) {
        document.getElementById("passwordError").textContent =
            "Password must have at least 6 characters";
    }
    else if (!/[A-Z]/.test(password)) {
        document.getElementById("passwordError").textContent =
            "Password must contain one uppercase letter";
    }
    else {
        document.getElementById("passwordError").textContent = "";
    }

});

usernameInput.addEventListener("blur", async function() {
   const username = usernameInput.value;
    if (username === "") {
        document.getElementById("usernameError").textContent = "";
        return;
    }
    const response = await fetch(
        "/check-username?username=" + encodeURIComponent(username)
    );
    const data = await response.json();
    if (data.exists) {
        document.getElementById("usernameError").textContent =
            "Username already exists";
    }
    else {
        document.getElementById("usernameError").textContent = "";
    }

});
form.addEventListener("submit", async function(event) {


    event.preventDefault();
    document.getElementById("successMessage").textContent = "";
    const fullName = fullNameInput.value;
    const email = emailInput.value;
    const username = usernameInput.value;
    const password = passwordInput.value;
    if (fullName.length < 2) {
        document.getElementById("nameError").textContent =
            "Full name is too short";
        return;
    }

    if (!email.includes("@") || !email.includes(".")) {
        document.getElementById("emailError").textContent =
            "Please enter a valid email";
        return;
    }

    if (username === "") {
        document.getElementById("usernameError").textContent =
            "Username is required";
        return;
    }

    if (password.length < 6) {
        document.getElementById("passwordError").textContent =
            "Password must have at least 6 characters";
        return;
    }

    if (!/[A-Z]/.test(password)) {
        document.getElementById("passwordError").textContent =
            "Password must contain one uppercase letter";
        return;
    }

    const response = await fetch("/register", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            fullName: fullName,
            email: email,
            username: username,
            password: password
        })

    });

    const data = await response.json();
    if (data.error === "name") {
        document.getElementById("nameError").textContent =
            "Full name is too short";
        return;
    }
    if (data.error === "email") {
        document.getElementById("emailError").textContent =
            "Please enter a valid email";
        return;
    }
    if (data.error === "username") {
        document.getElementById("usernameError").textContent =
            "Username already exists";
        return;
    }

    if (data.error === "passwordLength") {
        document.getElementById("passwordError").textContent =
            "Password must have at least 6 characters";
        return;
    }
    if (data.error === "passwordUppercase") {
        document.getElementById("passwordError").textContent =
            "Password must contain one uppercase letter";
        return;
    }
if (data.success) {
    localStorage.setItem("fullName", fullName);
    localStorage.setItem("username", username);
    localStorage.setItem("email", email);
    window.location.href = "/feed";
}
});

</script>

</body>

</html>
