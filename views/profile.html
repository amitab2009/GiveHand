<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/feed">
            GiveHand
        </a>

        <div>
            <a href="/feed"
               class="btn btn-outline-light">
                Feed
            </a>

            <a href="#"
               class="btn btn-outline-light">
                Groups
            </a>

            <a href="/profile"
               class="btn btn-outline-light active-page">
                Profile
            </a>
        </div>

    </div>

</nav>


<main class="profile-page">

    <div class="container">

        <div class="profile-heading">

            <h2>My Profile</h2>

            <p>
                View your personal GiveHand account details.
            </p>

        </div>


        <div class="profile-card">

            <div class="profile-banner"></div>


            <div class="profile-content">
<div class="profile-picture-section">

    <div class="profile-avatar" id="profileAvatar">
        Y
    </div>

    <input
        type="file"
        id="profileImageInput"
        accept="image/*"
        style="display: none;"
    >

    <button
        type="button"
        id="changeProfileImage"
        class="btn btn-outline-success profile-upload-btn"
    >
        Upload Picture
    </button>

</div>

                <div class="profile-main-details">

                    <h3 id="profileName">Loading...</h3>

                    <p class="profile-subtitle">
                        GiveHand Community Member
                    </p>


                    <div class="profile-information">

                        <div class="profile-field">

                            <span class="profile-field-label">
                                Full Name
                            </span>

                            <span class="profile-field-value">
                                <span id="fullName"></span>
                            </span>

                        </div>


                        <div class="profile-field">

                            <span class="profile-field-label">
                                Username
                            </span>

                            <span class="profile-field-value">
                                <span id="username"></span>
                            </span>

                        </div>


                        <div class="profile-field">

                            <span class="profile-field-label">
                                Email Address
                            </span>

                            <span class="profile-field-value">
                               <span id="email"></span>
                            </span>

                        </div>

                    </div>


    <div class="profile-actions">

        <a href="/feed"
         class="btn btn-success">
            Back to Feed
        </a>

        <a href="/login"
        class="btn profile-logout">
         Log Out
        </a>

    </div>

                </div>

            </div>

        </div>

    </div>

</main>
<script>

const fullName = localStorage.getItem("fullName");
const username = localStorage.getItem("username");
const email = localStorage.getItem("email");

const profileImageInput =
    document.getElementById("profileImageInput");

const changeProfileImage =
    document.getElementById("changeProfileImage");

const profileAvatar =
    document.getElementById("profileAvatar");


changeProfileImage.addEventListener("click", function () {
    profileImageInput.click();
});


profileImageInput.addEventListener("change", function () {

    const file = profileImageInput.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function (event) {

        const image = event.target.result;

        profileAvatar.innerHTML = `
            <img
                src="${image}"
                alt="Profile Picture"
                style="
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    border-radius: 50%;
                "
            >
        `;

        localStorage.setItem("profileImage", image);
    };

    reader.readAsDataURL(file);
});


const savedProfileImage =
    localStorage.getItem("profileImage");

if (savedProfileImage) {

    profileAvatar.innerHTML = `
        <img
            src="${savedProfileImage}"
            alt="Profile Picture"
            style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 50%;
            "
        >
    `;

}

if (fullName) {

    document.getElementById("profileName").textContent =
        fullName;

    document.getElementById("fullName").textContent =
        fullName;

    document.querySelector(".profile-avatar").textContent =
        fullName.charAt(0).toUpperCase();

}

if (username) {

    document.getElementById("username").textContent =
        username;

}

if (email) {

    document.getElementById("email").textContent =
        email;

}

</script>
</body>

</html>
