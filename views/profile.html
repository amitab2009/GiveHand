<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/feed">
            GiveHand
        </a>

        <div>
            <a href="/feed"
               class="btn btn-outline-light">
                Feed
            </a>

            <a href="#"
               class="btn btn-outline-light">
                Groups
            </a>

            <a href="/profile"
               class="btn btn-outline-light active-page">
                Profile
            </a>
        </div>

    </div>

</nav>


<main class="profile-page">

    <div class="container">

        <div class="profile-heading">

            <h2>My Profile</h2>

            <p>
                View your personal GiveHand account details.
            </p>

        </div>


        <div class="profile-card">

            <div class="profile-banner"></div>


            <div class="profile-content">

                <div class="profile-avatar">
                    Y
                </div>


                <div class="profile-main-details">

                    <h3>Yali Hadad</h3>

                    <p class="profile-subtitle">
                        GiveHand Community Member
                    </p>


                    <div class="profile-information">

                        <div class="profile-field">

                            <span class="profile-field-label">
                                Full Name
                            </span>

                            <span class="profile-field-value">
                                Yali Hadad
                            </span>

                        </div>


                        <div class="profile-field">

                            <span class="profile-field-label">
                                Username
                            </span>

                            <span class="profile-field-value">
                                yali123
                            </span>

                        </div>


                        <div class="profile-field">

                            <span class="profile-field-label">
                                Email Address
                            </span>

                            <span class="profile-field-value">
                                yali@example.com
                            </span>

                        </div>

                    </div>


    <div class="profile-actions">

        <a href="/feed"
         class="btn btn-success">
            Back to Feed
        </a>

        <a href="/login"
        class="btn profile-logout">
         Log Out
        </a>

    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
