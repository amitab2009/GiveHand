<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feed - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/feed">GiveHand</a>

        <div>
            <a href="/feed" class="btn btn-outline-light">Feed</a>
            <a href="#" class="btn btn-outline-light">Groups</a>
            <a href="#" class="btn btn-outline-light">Profile</a>
        </div>

    </div>

</nav>


<div class="feed-page">

    <div class="container">

        <div class="feed-top">

            <div>
                <h2>Community Projects</h2>

                <p>
                    Find a project that needs your help.
                </p>
            </div>

            <a href="/create-project" class="btn btn-success">
                 Create Project
             </a>

        </div>


        <div class="search-box">

            <input type="text" class="form-control"
                   placeholder="Search projects or locations">

            <button class="btn btn-success">
                Search
            </button>

        </div>


        <div class="row g-4" id="projectsList">

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

async function loadProjects() {

    const response = await fetch("/api/projects");
    const projects = await response.json();

    const list = document.getElementById("projectsList");

    list.innerHTML = "";

    projects.forEach(function(project) {

        const box = document.createElement("div");

        box.className = "col-lg-3 col-md-6";

        box.innerHTML = `
           <div class="project-card">

    ${project.image ? `
        <img src="${project.image}" class="project-img" alt="project image">
    ` : `
        <div class="project-top">
            <span class="project-category">
                ${project.category}
            </span>
        </div>
    `}

    <div class="project-info">

        <h4>${project.projectName}</h4>

        <p class="location">
            📍 ${project.location}
        </p>

        <p class="project-text">
            ${project.description}
        </p>

        <p class="looking">
            Looking for: ${project.volunteers} volunteers
        </p>

        <p class="contact">
            Contact: ${project.contact}
        </p>

        <button class="btn btn-success">
            Join Project
        </button>

    </div>

</div>
        `;

        list.appendChild(box);
    });

}

loadProjects();

</script>

</body>

</html>
