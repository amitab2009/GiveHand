<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/feed">GiveHand</a>

        <div>
            <a href="/feed" class="btn btn-outline-light">Feed</a>
            <a href="/groups" class="btn btn-outline-light">Groups</a>
            <a href="#" class="btn btn-outline-light">Profile</a>
        </div>

    </div>

</nav>
<div class="new-project">

    <div class="form-box">

        <h2>Create a Project</h2>

        <p>
            Tell people what kind of help you are looking for.
        </p>


       <form id="projectForm">

    <label>Project name</label>
    <input type="text" id="projectName" class="form-control">

    <label>Description</label>
    <textarea id="description" class="form-control" rows="4"></textarea>

    <div class="row2">

        <div>
            <label>Location</label>
            <input type="text" id="location" class="form-control">
        </div>

        <div>
            <label>Category</label>

            <select id="category" class="form-select">
                <option value="">Choose category</option>
                <option>Food</option>
                <option>Education</option>
                <option>Animals</option>
                <option>Environment</option>
                <option>Community</option>
            </select>
        </div>

    </div>

    <label>How many volunteers do you need?</label>
    <input type="number" id="volunteers" class="form-control">


    <label>Contact</label>
    <input type="text" id="contact" class="form-control"
           placeholder="Phone number or email">


    <label>Image</label>
<input type="file" id="image" class="form-control" accept="image/*">

    <p id="projectError" class="error-text"></p>


    <button type="submit" class="btn btn-success">
        Create Project
    </button>

</form>

    </div>

</div>
<script>

const form = document.getElementById("projectForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const projectName = document.getElementById("projectName").value.trim();
    const description = document.getElementById("description").value.trim();
    const location = document.getElementById("location").value.trim();
    const category = document.getElementById("category").value;
    const volunteers = document.getElementById("volunteers").value;
    const contact = document.getElementById("contact").value.trim();
    const image = document.getElementById("image").files[0];

    const errorBox = document.getElementById("projectError");

    errorBox.textContent = "";

    if (
        projectName === "" ||
        description === "" ||
        location === "" ||
        category === "" ||
        volunteers === "" ||
        contact === ""
    ) {
        errorBox.textContent = "Please fill in all fields";
        return;
    }

    const data = new FormData();

    data.append("projectName", projectName);
    data.append("description", description);
    data.append("location", location);
    data.append("category", category);
    data.append("volunteers", volunteers);
    data.append("contact", contact);

    if (image) {
        data.append("image", image);
    }

    try {

        const response = await fetch("/create-project", {
            method: "POST",
            body: data
        });

        const result = await response.json();

        if (result.success) {

            window.location.href = "/feed";

        } else {

            errorBox.textContent =
                result.error || "Could not create project";

        }

    } catch (error) {

        console.error("CREATE PROJECT ERROR:", error);

        errorBox.textContent =
            "Something went wrong while creating the project.";

    }

});

</script>
</body>

</html>
