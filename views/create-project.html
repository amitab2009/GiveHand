<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project - GiveHand</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/feed">GiveHand</a>

        <div>
            <a href="/feed" class="btn btn-outline-light">Feed</a>
            <a href="/groups" class="btn btn-outline-light">Groups</a>
            <a href="#" class="btn btn-outline-light">Profile</a>
        </div>

    </div>

</nav>


<div class="new-project">

    <div class="form-box">

        <h2>Create a Project</h2>

        <p>
            Tell people what kind of help you are looking for.
        </p>


        <form id="projectForm">

            <label>Project name</label>
            <input type="text" id="projectName" class="form-control">

            <label>Description</label>
            <textarea id="description" class="form-control" rows="4"></textarea>

            <div class="row2">

                <div>
                    <label>Location</label>
                    <input type="text" id="location" class="form-control">

                    <button type="button"
                            id="openCreateMapButton"
                            class="project-map-link">

                        Choose on map (optional)

                    </button>

                    <p id="selectedMapLocation"
                       class="selected-map-location">
                    </p>
                </div>

                <div>
                    <label>Category</label>

                    <select id="category" class="form-select">
                        <option value="">Choose category</option>
                        <option>Food</option>
                        <option>Education</option>
                        <option>Animals</option>
                        <option>Environment</option>
                        <option>Community</option>
                    </select>
                </div>

            </div>

            <label>How many volunteers do you need?</label>
            <input type="number" id="volunteers" class="form-control">


            <label>Contact</label>
            <input type="text" id="contact" class="form-control"
                   placeholder="Phone number or email">


            <label>Image</label>
            <input type="file" id="image" class="form-control" accept="image/*">

            <p id="projectError" class="error-text"></p>


            <button type="submit"
                    id="createProjectButton"
                    class="btn btn-success">

                Create Project

            </button>

        </form>

    </div>

</div>


<div id="createMapOverlay"
     class="map-overlay">

    <div class="map-modal">

        <button type="button"
                id="closeCreateMapButton"
                class="map-close-button"
                aria-label="Close map">

            ×

        </button>


        <div class="map-modal-header">

            <h3>
                Choose Project Location
            </h3>

            <p>
                Click anywhere on the map to choose the project location.
            </p>

        </div>


        <div id="createProjectMap"
             class="project-map">
        </div>


        <p id="createMapMessage"
           class="project-map-message">

            No location selected yet.

        </p>


        <button type="button"
                id="useMapLocationButton"
                class="btn btn-success create-map-use-button"
                disabled>

            Use This Location

        </button>

    </div>

</div>


<div id="toastMessage"
     class="toast-message">
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

const form =
    document.getElementById("projectForm");


const createProjectButton =
    document.getElementById("createProjectButton");


const toastMessage =
    document.getElementById("toastMessage");


const locationInput =
    document.getElementById("location");


const openCreateMapButton =
    document.getElementById("openCreateMapButton");


const createMapOverlay =
    document.getElementById("createMapOverlay");


const closeCreateMapButton =
    document.getElementById("closeCreateMapButton");


const createMapMessage =
    document.getElementById("createMapMessage");


const useMapLocationButton =
    document.getElementById("useMapLocationButton");


const selectedMapLocation =
    document.getElementById("selectedMapLocation");


let toastTimeout;


let createProjectMap = null;


let createProjectMarker = null;


let selectedLatitude = "";


let selectedLongitude = "";


let selectedLocationName = "";



function showToast(message, type) {

    clearTimeout(toastTimeout);

    toastMessage.textContent =
        message;

    toastMessage.className =
        "toast-message";


    if (type === "error") {

        toastMessage.classList.add(
            "toast-error"
        );

    }

    else {

        toastMessage.classList.add(
            "toast-success"
        );

    }


    setTimeout(
        function() {

            toastMessage.classList.add(
                "show"
            );

        },
        10
    );


    toastTimeout =
        setTimeout(
            function() {

                toastMessage.classList.remove(
                    "show"
                );

            },
            3000
        );

}



function openCreateMap() {

    createMapOverlay.classList.add(
        "show"
    );


    if (!createProjectMap) {

        createProjectMap =
            L.map(
                "createProjectMap"
            ).setView(
                [32.0853, 34.7818],
                8
            );


        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(
            createProjectMap
        );


        createProjectMap.on(
            "click",
            chooseMapLocation
        );

    }


    setTimeout(
        function() {

            createProjectMap.invalidateSize();

        },
        100
    );

}



async function chooseMapLocation(event) {

    selectedLatitude =
        event.latlng.lat;


    selectedLongitude =
        event.latlng.lng;


    if (!createProjectMarker) {

        createProjectMarker =
            L.marker(
                [
                    selectedLatitude,
                    selectedLongitude
                ]
            ).addTo(
                createProjectMap
            );

    }

    else {

        createProjectMarker.setLatLng(
            [
                selectedLatitude,
                selectedLongitude
            ]
        );

    }


    createMapMessage.textContent =
        "Finding location...";


    useMapLocationButton.disabled =
        true;


    try {

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/reverse" +
                "?format=json" +
                "&lat=" +
                selectedLatitude +
                "&lon=" +
                selectedLongitude
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.display_name
        ) {

            throw new Error(
                "Location could not be found"
            );

        }


        selectedLocationName =
            result.display_name;


        createMapMessage.textContent =
            selectedLocationName;


        useMapLocationButton.disabled =
            false;

    }

    catch (error) {

        selectedLocationName =
            "";


        createMapMessage.textContent =
            "Could not identify this location. Try another point.";

    }

}



openCreateMapButton.addEventListener(
    "click",
    openCreateMap
);



closeCreateMapButton.addEventListener(
    "click",
    function() {

        createMapOverlay.classList.remove(
            "show"
        );

    }
);



createMapOverlay.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            createMapOverlay
        ) {

            createMapOverlay.classList.remove(
                "show"
            );

        }

    }
);



useMapLocationButton.addEventListener(
    "click",
    function() {

        if (!selectedLocationName) {

            return;

        }


        locationInput.value =
            selectedLocationName;


        selectedMapLocation.textContent =
            "Map location selected ✓";


        createMapOverlay.classList.remove(
            "show"
        );

    }
);



locationInput.addEventListener(
    "input",
    function() {

        if (
            locationInput.value.trim() !==
            selectedLocationName
        ) {

            selectedLatitude =
                "";

            selectedLongitude =
                "";

            selectedLocationName =
                "";

            selectedMapLocation.textContent =
                "";

        }

    }
);



form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const projectName =
            document.getElementById("projectName").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const location =
            document.getElementById("location").value.trim();

        const category =
            document.getElementById("category").value;

        const volunteers =
            document.getElementById("volunteers").value;

        const contact =
            document.getElementById("contact").value.trim();

        const image =
            document.getElementById("image").files[0];

        const errorBox =
            document.getElementById("projectError");


        errorBox.textContent =
            "";


        if (
            projectName === "" ||
            description === "" ||
            location === "" ||
            category === "" ||
            volunteers === "" ||
            contact === ""
        ) {

            showToast(
                "Please fill in all fields",
                "error"
            );

            return;

        }


        if (Number(volunteers) < 1) {

            showToast(
                "Number of volunteers must be at least 1",
                "error"
            );

            return;

        }


        const data =
            new FormData();


        data.append(
            "projectName",
            projectName
        );

        data.append(
            "description",
            description
        );

        data.append(
            "location",
            location
        );

        data.append(
            "category",
            category
        );

        data.append(
            "volunteers",
            volunteers
        );

        data.append(
            "contact",
            contact
        );


        if (
            selectedLatitude !== "" &&
            selectedLongitude !== ""
        ) {

            data.append(
                "latitude",
                selectedLatitude
            );

            data.append(
                "longitude",
                selectedLongitude
            );

        }


        if (image) {

            data.append(
                "image",
                image
            );

        }


        createProjectButton.disabled =
            true;

        createProjectButton.textContent =
            "Creating...";


        try {

            const response =
                await fetch(
                    "/create-project",
                    {
                        method: "POST",
                        body: data
                    }
                );


            const result =
                await response.json();


            if (!response.ok || !result.success) {

                throw new Error(
                    result.error ||
                    "Could not create project"
                );

            }


            showToast(
                "Project created successfully!",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "/feed";

                },
                900
            );

        }

        catch (error) {

            console.error(
                "CREATE PROJECT ERROR:",
                error
            );


            createProjectButton.disabled =
                false;

            createProjectButton.textContent =
                "Create Project";


            showToast(
                error.message ||
                "Something went wrong while creating the project.",
                "error"
            );

        }

    }
);

</script>

</body>

</html>
